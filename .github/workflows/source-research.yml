name: inspect additional official monthly source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/discover_monthly_api.py', 'scripts/probe_monthly.py', 'scripts/collect_monthly_sample.py', 'src/materias_primas_chile/monthly.py', '.github/workflows/source-research.yml']
permissions:
  contents: write
concurrency:
  group: official-monthly-research
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/discover_monthly_api.py --max-scripts 10
      - name: Inspect verified public metadata and monthly form contract
        continue-on-error: true
        run: python scripts/probe_monthly.py
      - name: Acquire explicit retail bean and international maize monthly responses
        continue-on-error: true
        run: python scripts/collect_monthly_sample.py
      - name: Preserve discovered literals as research, not verified prices
        run: |
          mkdir -p data/research
          cp data/raw/research/odepa_monthly/discovery.json data/research/monthly_source_discovery.json
          cat data/research/monthly_source_discovery.json
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/monthly_source_discovery.json
          if test -f data/research/monthly_probe.json; then
            git add data/research/monthly_probe.json
          fi
          if test -d data/snapshots/monthly_candidates; then
            git add data/snapshots/monthly_candidates/
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'research: record literal endpoints of official monthly application'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly-source-research
          path: |
            data/raw/research/
            data/research/monthly_probe_raw/
            data/snapshots/monthly_candidates/
          retention-days: 30
