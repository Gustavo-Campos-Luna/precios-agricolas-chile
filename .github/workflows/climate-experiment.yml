name: conditional climate proxy experiment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/materias_primas_chile/features.py', 'scripts/run_climate_experiment.py', 'config/origin_climate_map.csv', '.github/workflows/climate-experiment.yml']
permissions:
  contents: write
concurrency:
  group: conditional-climate-proxy-experiment
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[parquet]'
      - name: Evaluate explicitly mapped origin proxies and illustrative assumptions
        run: python scripts/run_climate_experiment.py
      - name: Preserve experimental results and limitations in this repository
        run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/experiments/climate_proxy_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'experiment: evaluate conditional lagged climate proxy scenarios'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conditional-climate-proxy-experiment
          path: data/experiments/climate_proxy_v1/
          retention-days: 30
